<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ BrewNav - Login & Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-amber-950 flex items-center justify-center min-h-screen p-4 text-gray-800">

  <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-amber-950 flex items-center justify-center gap-2">☕ BrewNav</h1>
      <p class="text-xs text-amber-800 mt-1">BGC & Makati Coffee & Route Finder</p>
    </div>

    <h2 id="modalTitle" class="text-xl font-bold mb-4 text-gray-800">Login to Your Account</h2>

    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Email Address</label>
        <input type="email" id="authEmail" required placeholder="you@example.com" class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
        <input type="password" id="authPassword" required placeholder="••••••••" class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 outline-none">
      </div>
      <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-amber-900 hover:bg-amber-800 text-white font-bold rounded-lg text-sm transition shadow-md">
        Login
      </button>
    </form>

    <p class="text-xs text-center mt-6 text-gray-500">
      <span id="toggleAuthText">Don't have an account?</span>
      <button id="toggleAuthBtn" class="text-amber-800 font-bold underline ml-1">Sign Up</button>
    </p>

    <div class="mt-6 text-center border-t pt-4">
      <a href="brewnav.html" class="text-xs text-gray-500 hover:text-amber-900 underline">Continue as Guest (Map Only) →</a>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script>
    let isSignUpMode = false;

    document.addEventListener('DOMContentLoaded', async () => {
      // If already logged in, redirect straight to map
      const user = await getCurrentUser();
      if (user) {
        window.location.href = 'brewnav.html';
      }
    });

    document.getElementById('toggleAuthBtn').addEventListener('click', () => {
      isSignUpMode = !isSignUpMode;
      document.getElementById('modalTitle').innerText = isSignUpMode ? 'Create an Account' : 'Login to Your Account';
      document.getElementById('authSubmitBtn').innerText = isSignUpMode ? 'Sign Up' : 'Login';
      document.getElementById('toggleAuthText').innerText = isSignUpMode ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('toggleAuthBtn').innerText = isSignUpMode ? 'Login' : 'Sign Up';
    });

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;

      const { data, error } = isSignUpMode ? await signUpUser(email, password) : await signInUser(email, password);

      if (error) {
        alert(error.message);
      } else {
        if (isSignUpMode) {
          alert('Account created! Verification link sent to your email.');
        } else {
          window.location.href = 'brewnav.html';
        }
      }
    });
  </script>
</body>
</html>

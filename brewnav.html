<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ BrewNav - BGC & Makati Coffee Finder</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 flex flex-col h-screen overflow-hidden text-gray-800">

  <!-- Header Navigation -->
  <header class="bg-amber-900 text-white p-4 shadow-md flex justify-between items-center z-10">
    <div>
      <h1 class="text-xl font-bold flex items-center gap-2">☕ BrewNav</h1>
      <p class="text-xs text-amber-200">BGC & Makati Coffee & Route Finder</p>
    </div>
    <div class="flex items-center gap-2">
      <a href="dashboard.html" id="dashboardLink" class="hidden bg-amber-800 hover:bg-amber-700 px-3 py-1.5 rounded-lg text-xs font-medium transition">
        My Dashboard
      </a>
      <a href="login.html" id="authBtn" class="bg-amber-700 hover:bg-amber-600 px-3 py-1.5 rounded-lg text-xs font-medium transition">
        Login / Sign Up
      </a>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="flex-1 flex flex-col md:flex-row relative overflow-hidden">
    
    <!-- Sidebar / Filters -->
    <aside class="w-full md:w-80 bg-white shadow-lg p-4 flex flex-col z-10 overflow-y-auto max-h-[40vh] md:max-h-full">
      <h2 class="font-bold text-gray-700 mb-3 text-sm tracking-wide uppercase">Filters</h2>
      
      <!-- District Filter -->
      <div class="mb-3">
        <label class="block text-xs font-semibold mb-1">District</label>
        <select id="districtFilter" class="w-full p-2 border border-gray-300 rounded-lg text-sm bg-gray-50">
          <option value="ALL">All Districts (BGC & Makati)</option>
          <option value="BGC">BGC (Taguig)</option>
          <option value="Makati">Makati City</option>
        </select>
      </div>

      <!-- Price Filter -->
      <div class="mb-3">
        <label class="block text-xs font-semibold mb-1">Max Price Level</label>
        <select id="priceFilter" class="w-full p-2 border border-gray-300 rounded-lg text-sm bg-gray-50">
          <option value="ALL">Any Price</option>
          <option value="₱">₱ (Under ₱150)</option>
          <option value="₱₱">₱₱ (₱150 - ₱250)</option>
          <option value="₱₱₱">₱₱₱ (₱250+)</option>
        </select>
      </div>

      <!-- Checkboxes -->
      <div class="space-y-2 mb-4">
        <label class="flex items-center text-xs font-medium gap-2 cursor-pointer">
          <input type="checkbox" id="wifiFilter" class="rounded text-amber-800"> Has High-Speed WiFi
        </label>
        <label class="flex items-center text-xs font-medium gap-2 cursor-pointer">
          <input type="checkbox" id="socketsFilter" class="rounded text-amber-800"> Power Outlets Available
        </label>
      </div>

      <button id="resetFilters" class="w-full py-2 bg-gray-100 hover:bg-gray-200 text-xs font-semibold rounded-lg text-gray-600 transition">
        Reset Filters
      </button>

      <!-- Cafe List -->
      <hr class="my-4">
      <h2 class="font-bold text-gray-700 mb-2 text-sm tracking-wide uppercase">Nearby Cafes</h2>
      <div id="cafeList" class="space-y-2 flex-1 overflow-y-auto text-sm">
        <!-- Dynamically Loaded -->
      </div>
    </aside>

    <!-- Map Canvas -->
    <main class="flex-1 relative h-full">
      <div id="map" class="w-full h-full z-0"></div>

      <!-- Floating Route Banner -->
      <div id="routeBanner" class="hidden absolute top-4 left-4 right-4 md:left-auto md:right-4 md:w-80 bg-amber-900 text-white p-4 rounded-xl shadow-2xl z-20 transition-all">
        <div class="flex justify-between items-start mb-2">
          <h3 id="routeTitle" class="font-bold text-base">Route Navigation</h3>
          <button id="closeRouteBtn" class="text-amber-200 hover:text-white text-lg font-bold">&times;</button>
        </div>
        <p id="routeDetails" class="text-xs text-amber-100 mb-3">Calculating OSRM street route...</p>
        <div class="flex gap-2">
          <a id="wazeBtn" href="#" target="_blank" class="flex-1 bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold py-2 rounded-lg text-center transition">
            Open in Waze
          </a>
          <a id="gmapsBtn" href="#" target="_blank" class="flex-1 bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 rounded-lg text-center transition">
            Google Maps
          </a>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
